[project]
name = "feature-store"
version = "0.1.0"
description = "A feature store built from scratch: offline store, online store, point-in-time joins"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["feature_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
